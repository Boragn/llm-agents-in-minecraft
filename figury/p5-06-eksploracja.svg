<text x="620.0" y="119.0" font-family="sans-serif" font-size="11" fill="#d8dee9" text-anchor="start">granic typu ruda: brak, wybrano najlepsza ogolnie</text>
<text x="620.0" y="136.0" font-family="sans-serif" font-size="11" fill="#d8dee9" text-anchor="start">odcinkow 4, droga ok. 159 m, 98 s</text>
<text x="620.0" y="153.0" font-family="sans-serif" font-size="11" fill="#d8dee9" text-anchor="start">poznane 94% -&gt; 33% (zmiana srodka okna)</text>
<text x="620.0" y="190.0" font-family="sans-serif" font-size="12" fill="#e8d06b" text-anchor="start" font-weight="bold">Czego brakuje modelowi:</text>
<text x="620.0" y="210.0" font-family="sans-serif" font-size="11" fill="#e8d06b" text-anchor="start">raport nie mowi, co dalej (kilof?),</text>
<text x="620.0" y="226.0" font-family="sans-serif" font-size="11" fill="#e8d06b" text-anchor="start">zloze bez kilofa jest bezuzyteczne,</text>
<text x="620.0" y="242.0" font-family="sans-serif" font-size="11" fill="#e8d06b" text-anchor="start">a menu nie ma drogi do kilofa</text>
<text x="620.0" y="258.0" font-family="sans-serif" font-size="11" fill="#e8d06b" text-anchor="start">(stol, deski, postaw).</text>
