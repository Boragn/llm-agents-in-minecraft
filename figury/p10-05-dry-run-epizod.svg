<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" shape-rendering="crispEdges">
<rect width="1000" height="640" fill="#0f1218"/>
<text x="12.0" y="22.0" font-family="sans-serif" font-size="15" fill="#d8dee9" text-anchor="start" font-weight="bold">Dry-run konsolidacji (WY-8, tura 15): płaskie wspomnienie kontra epizod z kontekstem</text>
<text x="12.0" y="40.0" font-family="sans-serif" font-size="11" fill="#8b97aa" text-anchor="start">Lewa: prawdziwe wspomnienia i lekcje z próby. Prawa: ten sam materiał jako epizod (projekt) i lekcja, którą epizod pozwala napisać.</text>
<rect x="14.0" y="70.0" width="470.0" height="230.0" fill="#161b24" rx="6" stroke="#2c3646" stroke-width="1.5"/>
<text x="26.0" y="90.0" font-family="sans-serif" font-size="12" fill="#3ddc6a" text-anchor="start" font-weight="bold">W-0001  handel (waga 7)</text>
<text x="26.0" y="110.0" font-family="sans-serif" font-size="11" fill="#8b97aa" text-anchor="start">WSPOMNIENIE (płaskie zdanie):</text>
<text x="26.0" y="126.0" font-family="sans-serif" font-size="11" fill="#d8dee9" text-anchor="start">sprzedaz 2 leather Handlarzowi po 1 szmaragdzie (oferta #1), potem 2</text>
<text x="26.0" y="141.0" font-family="sans-serif" font-size="11" fill="#d8dee9" text-anchor="start">beef za 1 szmaragd i kupno luku i strzal</text>
<text x="26.0" y="166.0" font-family="sans-serif" font-size="11" fill="#8b97aa" text-anchor="start">LEKCJA z próby:</text>
<text x="26.0" y="182.0" font-family="sans-serif" font-size="11" fill="#7bc67b" text-anchor="start">Handlarz w okolicy (-197, 116, 56) przyjął 2 leather po 1 szmaragd i 2</text>
<text x="26.0" y="197.0" font-family="sans-serif" font-size="11" fill="#7bc67b" text-anchor="start">beef za 1 szmaragd, a za szmaragdy bot kupił łuk i strzały.</text>
<text x="26.0" y="290.0" font-family="sans-serif" font-size="11" fill="#7bc67b" text-anchor="start" font-weight="bold">poprawna: wynik i lokacja zgodne z logiem</text>
<rect x="14.0" y="320.0" width="470.0" height="230.0" fill="#161b24" rx="6" stroke="#2c3646" stroke-width="1.5"/>
<text x="26.0" y="340.0" font-family="sans-serif" font-size="12" fill="#f0a04b" text-anchor="start" font-weight="bold">W-0002  odrzucona_akcja (waga 5)</text>
<text x="26.0" y="360.0" font-family="sans-serif" font-size="11" fill="#8b97aa" text-anchor="start">WSPOMNIENIE (płaskie zdanie):</text>
<text x="26.0" y="376.0" font-family="sans-serif" font-size="11" fill="#d8dee9" text-anchor="start">wykonaj A18 --zastap odrzucone: A18 nie przyjmuje ilosci (opcja po</text>
<text x="26.0" y="391.0" font-family="sans-serif" font-size="11" fill="#d8dee9" text-anchor="start">wykonaj), potem poprawne wykonaj A18</text>
<text x="26.0" y="416.0" font-family="sans-serif" font-size="11" fill="#8b97aa" text-anchor="start">LEKCJA z próby:</text>
<text x="26.0" y="432.0" font-family="sans-serif" font-size="11" fill="#e5565b" text-anchor="start">Akcja A18 nie przyjmuje ilości jako opcji po `wykonaj`; `wykonaj A18</text>
<text x="26.0" y="447.0" font-family="sans-serif" font-size="11" fill="#e5565b" text-anchor="start">--zastap` z ilością dało E_ZLE_PARAMETRY, a poprawne `wykonaj A18` bez</text>
<text x="26.0" y="462.0" font-family="sans-serif" font-size="11" fill="#e5565b" text-anchor="start">ilości zadziałało.</text>
<text x="26.0" y="540.0" font-family="sans-serif" font-size="11" fill="#e5565b" text-anchor="start" font-weight="bold">częściowo błędna: powtarza komunikat błędu („nie przyjmuje ilości”)</text>
<rect x="504.0" y="70.0" width="480.0" height="480.0" fill="#161b24" rx="6" stroke="#d070d0" stroke-width="2"/>
<text x="516.0" y="92.0" font-family="sans-serif" font-size="12" fill="#d070d0" text-anchor="start" font-weight="bold">EPIZOD dla W-0002 (projekt, dane z logu WY-8)</text>
<text x="518.0" y="116.0" font-family="sans-serif" font-size="11" fill="#8b97aa" text-anchor="start" font-weight="bold">czynność poprzednia</text>
<text x="654.0" y="116.0" font-family="sans-serif" font-size="11" fill="#d8dee9" text-anchor="start">k-009: kup strzały, potem eksploruj zwierzyna</text>
<text x="654.0" y="131.0" font-family="sans-serif" font-size="11" fill="#d8dee9" text-anchor="start">(trwa)</text>
<text x="518.0" y="152.0" font-family="sans-serif" font-size="11" fill="#4fb3d9" text-anchor="start" font-weight="bold">czynność</text>
<text x="654.0" y="152.0" font-family="sans-serif" font-size="11" fill="#d8dee9" text-anchor="start">wykonaj A18 --zastap, gdzie A18 = eksploruj</text>
<text x="654.0" y="167.0" font-family="sans-serif" font-size="11" fill="#d8dee9" text-anchor="start">zwierzyna</text>
<text x="518.0" y="188.0" font-family="sans-serif" font-size="11" fill="#e5565b" text-anchor="start" font-weight="bold">wynik</text>
<text x="654.0" y="188.0" font-family="sans-serif" font-size="11" fill="#d8dee9" text-anchor="start">NIEWYKONALNE: E_ZLE_PARAMETRY „A18 nie przyjmuje</text>
<text x="654.0" y="203.0" font-family="sans-serif" font-size="11" fill="#d8dee9" text-anchor="start">ilości”: `--zastap` czytane jako ilość</text>
<text x="518.0" y="224.0" font-family="sans-serif" font-size="11" fill="#8b97aa" text-anchor="start" font-weight="bold">czynność następna</text>
<text x="654.0" y="224.0" font-family="sans-serif" font-size="11" fill="#d8dee9" text-anchor="start">wykonaj A18 bez opcji: przyjęte, ale w kolejce za</text>
<text x="654.0" y="239.0" font-family="sans-serif" font-size="11" fill="#d8dee9" text-anchor="start">k-009</text>
<text x="518.0" y="260.0" font-family="sans-serif" font-size="11" fill="#ffd84a" text-anchor="start" font-weight="bold">skutek w czasie</text>
<text x="654.0" y="260.0" font-family="sans-serif" font-size="11" fill="#d8dee9" text-anchor="start">start dopiero po końcu k-009: 142 ticki czekania</text>
<text x="654.0" y="275.0" font-family="sans-serif" font-size="11" fill="#d8dee9" text-anchor="start">(1849967 -&gt; 1850109)</text>
<text x="518.0" y="296.0" font-family="sans-serif" font-size="11" fill="#d070d0" text-anchor="start" font-weight="bold">lokacja</text>
<text x="654.0" y="296.0" font-family="sans-serif" font-size="11" fill="#d8dee9" text-anchor="start">(-206, 66): rynek 12 m NE; ratusz 13 m W</text>
<text x="518.0" y="317.0" font-family="sans-serif" font-size="11" fill="#6fd0b4" text-anchor="start" font-weight="bold">encje</text>
<text x="654.0" y="317.0" font-family="sans-serif" font-size="11" fill="#d8dee9" text-anchor="start">Wilga, łańcuch k-009 (eksploracja), menu A18</text>
<text x="518.0" y="338.0" font-family="sans-serif" font-size="11" fill="#e8d06b" text-anchor="start" font-weight="bold">waga / pewność</text>
<text x="654.0" y="338.0" font-family="sans-serif" font-size="11" fill="#d8dee9" text-anchor="start">5 / średnia (komunikat moda nie mówi prawdziwej</text>
<text x="654.0" y="353.0" font-family="sans-serif" font-size="11" fill="#d8dee9" text-anchor="start">przyczyny)</text>
<text x="518.0" y="386.0" font-family="sans-serif" font-size="11" fill="#7bc67b" text-anchor="start" font-weight="bold">LEKCJA, którą epizod pozwala napisać:</text>
<text x="518.0" y="404.0" font-family="sans-serif" font-size="11" fill="#7bc67b" text-anchor="start">Opcja `--zastap` po `wykonaj A..` jest czytana jako ilość i odrzucana;</text>
<text x="518.0" y="419.0" font-family="sans-serif" font-size="11" fill="#7bc67b" text-anchor="start">żeby zastąpić trwający łańcuch, najpierw `stop`, potem `wykonaj A18`.</text>
<text x="518.0" y="434.0" font-family="sans-serif" font-size="11" fill="#7bc67b" text-anchor="start">Bez tego nowy łańcuch czeka w kolejce (tu 142 ticki).</text>
<text x="14.0" y="590.0" font-family="sans-serif" font-size="11" fill="#8b97aa" text-anchor="start">Źródło lewej kolumny: archiwum wspomnień i warstwa lekcji z dry-runu (dodatki/dane/dry-run-konsolidacji). Prawa kolumna: projekt epizodu, lekcja proponowana (nie wygenerowana).</text>
<text x="14.0" y="608.0" font-family="sans-serif" font-size="11" fill="#8b97aa" text-anchor="start">Lekcja o sprzedaży jest poprawna, ale bez kontekstu nie mówi, skąd wzięły się skóry (zabicie krowy ok. 410 ticków wcześniej, potem 56 m drogi do Handlarza).</text>
</svg>
