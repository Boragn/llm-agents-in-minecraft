<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" shape-rendering="crispEdges">
<rect width="1000" height="330" fill="#0f1218"/>
<text x="12.0" y="22.0" font-family="sans-serif" font-size="15" fill="#d8dee9" text-anchor="start" font-weight="bold">Pierwsza sprzedaz w WY-8: Wilga przed i po wizycie u handlarza (dziennik tur 8 i 10)</text>
<rect x="14.0" y="56.0" width="480.0" height="180.0" fill="#161b24" rx="6" stroke="#4fb3d9"/>
<text x="26.0" y="78.0" font-family="sans-serif" font-size="12" fill="#4fb3d9" text-anchor="start" font-weight="bold">tura 8: idzie do handlarza</text>
<rect x="26.0" y="89.0" width="58.2" height="19" rx="4" fill="#161b24" stroke="#7bc67b"/>
<text x="32.0" y="103.0" font-family="sans-serif" font-size="11" fill="#7bc67b" text-anchor="start">beef x2</text>
<rect x="90.2" y="89.0" width="64.8" height="19" rx="4" fill="#161b24" stroke="#d8dee9"/>
<text x="96.2" y="103.0" font-family="sans-serif" font-size="11" fill="#d8dee9" text-anchor="start">bread x1</text>
<rect x="161.0" y="89.0" width="78.0" height="19" rx="4" fill="#161b24" stroke="#7bc67b"/>
<text x="167.0" y="103.0" font-family="sans-serif" font-size="11" fill="#7bc67b" text-anchor="start">leather x2</text>
<rect x="245.0" y="89.0" width="97.8" height="19" rx="4" fill="#161b24" stroke="#d8dee9"/>
<text x="251.0" y="103.0" font-family="sans-serif" font-size="11" fill="#d8dee9" text-anchor="start">wooden_axe x1</text>
<text x="26.0" y="126.0" font-family="sans-serif" font-size="11" fill="#8b97aa" text-anchor="start">PLAN:</text>
<text x="66.0" y="126.0" font-family="sans-serif" font-size="11" fill="#d8dee9" text-anchor="start">idę do Handlarza sprzedać 2 leather (2 szmaragdy); potem</text>
<text x="66.0" y="141.0" font-family="sans-serif" font-size="11" fill="#d8dee9" text-anchor="start">mięso, a w stronę konia dalej polować na krowy.</text>
<rect x="509.0" y="56.0" width="480.0" height="180.0" fill="#161b24" rx="6" stroke="#4fb3d9"/>
<text x="521.0" y="78.0" font-family="sans-serif" font-size="12" fill="#4fb3d9" text-anchor="start" font-weight="bold">tura 10: po sprzedazy</text>
<rect x="521.0" y="89.0" width="58.2" height="19" rx="4" fill="#161b24" stroke="#7bc67b"/>
<text x="527.0" y="103.0" font-family="sans-serif" font-size="11" fill="#7bc67b" text-anchor="start">beef x2</text>
<rect x="585.2" y="89.0" width="64.8" height="19" rx="4" fill="#161b24" stroke="#d8dee9"/>
<text x="591.2" y="103.0" font-family="sans-serif" font-size="11" fill="#d8dee9" text-anchor="start">bread x1</text>
<rect x="656.0" y="89.0" width="78.0" height="19" rx="4" fill="#161b24" stroke="#3ddc6a"/>
<text x="662.0" y="103.0" font-family="sans-serif" font-size="11" fill="#3ddc6a" text-anchor="start">emerald x2</text>
<rect x="740.0" y="89.0" width="97.8" height="19" rx="4" fill="#161b24" stroke="#d8dee9"/>
<text x="746.0" y="103.0" font-family="sans-serif" font-size="11" fill="#d8dee9" text-anchor="start">wooden_axe x1</text>
<text x="521.0" y="126.0" font-family="sans-serif" font-size="11" fill="#8b97aa" text-anchor="start">PLAN:</text>
<text x="561.0" y="126.0" font-family="sans-serif" font-size="11" fill="#d8dee9" text-anchor="start">kontynuuje lancuch do Handlarza, sprzedaz beef i leather.</text>
<text x="14.0" y="262.0" font-family="sans-serif" font-size="12" fill="#d8dee9" text-anchor="start" font-weight="bold">Notatka z rozmowy z handlarzem (zapisana automatycznie): oferty skupu</text>
<rect x="14.0" y="275.0" width="157.2" height="19" rx="4" fill="#161b24" stroke="#3ddc6a"/>
<text x="20.0" y="289.0" font-family="sans-serif" font-size="11" fill="#3ddc6a" text-anchor="start">1 leather -&gt; 1 emerald</text>
<rect x="177.2" y="275.0" width="137.4" height="19" rx="4" fill="#161b24" stroke="#3ddc6a"/>
<text x="183.2" y="289.0" font-family="sans-serif" font-size="11" fill="#3ddc6a" text-anchor="start">2 beef -&gt; 1 emerald</text>
<rect x="320.6" y="275.0" width="163.8" height="19" rx="4" fill="#161b24" stroke="#3ddc6a"/>
<text x="326.6" y="289.0" font-family="sans-serif" font-size="11" fill="#3ddc6a" text-anchor="start">2 porkchop -&gt; 1 emerald</text>
<rect x="490.4" y="275.0" width="150.6" height="19" rx="4" fill="#161b24" stroke="#3ddc6a"/>
<text x="496.4" y="289.0" font-family="sans-serif" font-size="11" fill="#3ddc6a" text-anchor="start">2 mutton -&gt; 1 emerald</text>
<rect x="647.0" y="275.0" width="157.2" height="19" rx="4" fill="#161b24" stroke="#3ddc6a"/>
<text x="653.0" y="289.0" font-family="sans-serif" font-size="11" fill="#3ddc6a" text-anchor="start">2 chicken -&gt; 1 emerald</text>
</svg>
