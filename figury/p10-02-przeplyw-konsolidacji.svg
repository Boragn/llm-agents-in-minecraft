<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430" shape-rendering="crispEdges">
<rect width="1000" height="430" fill="#0f1218"/>
<text x="12.0" y="22.0" font-family="sans-serif" font-size="15" fill="#d8dee9" text-anchor="start" font-weight="bold">Przepływ konsolidacji wspomnień (moduł konsolidacji w harnessie, dry-run wykonany)</text>
<rect x="14.0" y="60.0" width="170.0" height="90.0" fill="#161b24" rx="8" stroke="#e8d06b" stroke-width="2"/>
<text x="99.0" y="82.0" font-family="sans-serif" font-size="12" fill="#e8d06b" text-anchor="middle" font-weight="bold">Inbox wspomnień</text>
<text x="99.0" y="100.0" font-family="sans-serif" font-size="11" fill="#d8dee9" text-anchor="middle">wyniki tur i log moda</text>
<text x="99.0" y="115.0" font-family="sans-serif" font-size="11" fill="#d8dee9" text-anchor="middle">typ, waga, licznik</text>
<rect x="214.0" y="60.0" width="170.0" height="90.0" fill="#161b24" rx="8" stroke="#f0a04b" stroke-width="2"/>
<text x="299.0" y="82.0" font-family="sans-serif" font-size="12" fill="#f0a04b" text-anchor="middle" font-weight="bold">Wyzwalacz</text>
<text x="299.0" y="100.0" font-family="sans-serif" font-size="11" fill="#d8dee9" text-anchor="middle">co N tur, X wspomnień</text>
<text x="299.0" y="115.0" font-family="sans-serif" font-size="11" fill="#d8dee9" text-anchor="middle">albo suma wag &gt;= W</text>
<rect x="414.0" y="60.0" width="170.0" height="90.0" fill="#161b24" rx="8" stroke="#e5565b" stroke-width="2"/>
<text x="499.0" y="82.0" font-family="sans-serif" font-size="12" fill="#e5565b" text-anchor="middle" font-weight="bold">STOP świata</text>
<text x="499.0" y="100.0" font-family="sans-serif" font-size="11" fill="#d8dee9" text-anchor="middle">tryb turowy:</text>
<text x="499.0" y="115.0" font-family="sans-serif" font-size="11" fill="#d8dee9" text-anchor="middle">żadnego kroku świata</text>
<rect x="614.0" y="60.0" width="170.0" height="90.0" fill="#161b24" rx="8" stroke="#b48ead" stroke-width="2"/>
<text x="699.0" y="82.0" font-family="sans-serif" font-size="12" fill="#b48ead" text-anchor="middle" font-weight="bold">Subagent</text>
<text x="699.0" y="100.0" font-family="sans-serif" font-size="11" fill="#d8dee9" text-anchor="middle">osobny na ciało,</text>
<text x="699.0" y="115.0" font-family="sans-serif" font-size="11" fill="#d8dee9" text-anchor="middle">tylko odczyt</text>
<rect x="814.0" y="60.0" width="170.0" height="90.0" fill="#161b24" rx="8" stroke="#ffffff" stroke-width="2"/>
<text x="899.0" y="82.0" font-family="sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">Strażnik zapisu</text>
<text x="899.0" y="100.0" font-family="sans-serif" font-size="11" fill="#d8dee9" text-anchor="middle">źródło, limit tokenów,</text>
<text x="899.0" y="115.0" font-family="sans-serif" font-size="11" fill="#d8dee9" text-anchor="middle">zakazy, bez duplikatów</text>
<rect x="614.0" y="220.0" width="170.0" height="90.0" fill="#161b24" rx="8" stroke="#7bc67b" stroke-width="2"/>
<text x="699.0" y="242.0" font-family="sans-serif" font-size="12" fill="#7bc67b" text-anchor="middle" font-weight="bold">Warstwa lekcji</text>
<text x="699.0" y="260.0" font-family="sans-serif" font-size="11" fill="#d8dee9" text-anchor="middle">lekcje-&lt;ciało&gt;.md,</text>
<text x="699.0" y="275.0" font-family="sans-serif" font-size="11" fill="#d8dee9" text-anchor="middle">wygasanie bez potwierdzenia</text>
<rect x="414.0" y="220.0" width="170.0" height="90.0" fill="#161b24" rx="8" stroke="#d070d0" stroke-width="2"/>
<text x="499.0" y="242.0" font-family="sans-serif" font-size="12" fill="#d070d0" text-anchor="middle" font-weight="bold">Sieć znaczeń</text>
<text x="499.0" y="260.0" font-family="sans-serif" font-size="11" fill="#d8dee9" text-anchor="middle">epizody, encje, lokacje</text>
<text x="499.0" y="275.0" font-family="sans-serif" font-size="11" fill="#d8dee9" text-anchor="middle">(PROJEKT)</text>
<rect x="214.0" y="220.0" width="170.0" height="90.0" fill="#161b24" rx="8" stroke="#4fb3d9" stroke-width="2"/>
<text x="299.0" y="242.0" font-family="sans-serif" font-size="12" fill="#4fb3d9" text-anchor="middle" font-weight="bold">Klatka bota</text>
<text x="299.0" y="260.0" font-family="sans-serif" font-size="11" fill="#d8dee9" text-anchor="middle">lekcje i sieć</text>
<text x="299.0" y="275.0" font-family="sans-serif" font-size="11" fill="#d8dee9" text-anchor="middle">w następnym wywołaniu</text>
<line x1="184.0" y1="105.0" x2="208.0" y2="105.0" stroke="#8b97aa" stroke-width="2" shape-rendering="geometricPrecision"/>
<polygon points="214.0,105.0 204.8,108.9 204.8,101.1" fill="#8b97aa"/>
<line x1="384.0" y1="105.0" x2="408.0" y2="105.0" stroke="#8b97aa" stroke-width="2" shape-rendering="geometricPrecision"/>
<polygon points="414.0,105.0 404.8,108.9 404.8,101.1" fill="#8b97aa"/>
<line x1="584.0" y1="105.0" x2="608.0" y2="105.0" stroke="#8b97aa" stroke-width="2" shape-rendering="geometricPrecision"/>
<polygon points="614.0,105.0 604.8,108.9 604.8,101.1" fill="#8b97aa"/>
<line x1="784.0" y1="105.0" x2="808.0" y2="105.0" stroke="#8b97aa" stroke-width="2" shape-rendering="geometricPrecision"/>
<polygon points="814.0,105.0 804.8,108.9 804.8,101.1" fill="#8b97aa"/>
<polyline fill="none" stroke="#8b97aa" stroke-width="2" points="899,150 899,190 699,190 699,214"/>
<polygon points="699,220 693,210 705,210" fill="#8b97aa"/>
<line x1="614" y1="265" x2="590" y2="265" stroke="#8b97aa" stroke-width="2"/><polygon points="584,265 594,259 594,271" fill="#8b97aa"/>
<line x1="414" y1="265" x2="390" y2="265" stroke="#8b97aa" stroke-width="2"/><polygon points="384,265 394,259 394,271" fill="#8b97aa"/>
<polyline fill="none" stroke="#d070d0" stroke-width="2" stroke-dasharray="5 3" points="499,310 499,330"/>
<text x="14.0" y="350.0" font-family="sans-serif" font-size="11" fill="#d8dee9" text-anchor="start">Dry-run (WY-8, tura 15): wyzwalacz liczby wspomnień (próg obniżony w próbie) na 2 wspomnieniach Wilgi (suma wag 12), świat stał,</text>
<text x="14.0" y="368.0" font-family="sans-serif" font-size="11" fill="#d8dee9" text-anchor="start">subagent napisał 2 lekcje (129 z 3000 tokenów warstwy, 0,0189 USD), wspomnienia przeszły do archiwum.</text>
<text x="14.0" y="386.0" font-family="sans-serif" font-size="11" fill="#e8d06b" text-anchor="start">Sieć znaczeń i epizody (fioletowe) są projektem: nie są zaimplementowane w harnessie.</text>
</svg>
