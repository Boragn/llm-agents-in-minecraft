<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" shape-rendering="crispEdges">
<rect width="1000" height="330" fill="#0f1218"/>
<text x="12.0" y="22.0" font-family="sans-serif" font-size="15" fill="#d8dee9" text-anchor="start" font-weight="bold">Przejecie dropu: skutek akcji w jej wyniku, a nie w porownaniu ekwipunku</text>
<text x="12.0" y="40.0" font-family="sans-serif" font-size="11" fill="#8b97aa" text-anchor="start">Wilga w WY-6, tura 19: wynik kroku lancucha. Ponizej ekwipunek po przebiegu (odczyt `ekwipunek`).</text>
