<text x="762.0" y="92.0" font-family="sans-serif" font-size="12" fill="#3f78b8" text-anchor="start" font-weight="bold">ekwipunek</text>
<text x="762.0" y="114.0" font-family="sans-serif" font-size="11" fill="#d8dee9" text-anchor="start">+ mutton x1, white_wool x1</text>
<text x="20.0" y="172.0" font-family="sans-serif" font-size="12" fill="#d8dee9" text-anchor="start" font-weight="bold">Ekwipunek Wilgi po WY-6:</text>
