<text x="30.0" y="92.0" font-family="sans-serif" font-size="12" fill="#e5565b" text-anchor="start" font-weight="bold">krok k-063.2</text>
<text x="30.0" y="114.0" font-family="sans-serif" font-size="11" fill="#d8dee9" text-anchor="start">atakuj najblizszy sheep</text>
<polygon points="246,96 258,102 246,108" fill="#8b97aa"/>
<line x1="240" y1="102" x2="248" y2="102" stroke="#8b97aa" stroke-width="2"/>
