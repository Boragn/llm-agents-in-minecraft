<text x="26.0" y="197.0" font-family="sans-serif" font-size="11" fill="#e5565b" text-anchor="start">ink_sac x116</text>
<rect x="117.2" y="183.0" width="117.6" height="19" rx="4" fill="#161b24" stroke="#d8dee9"/>
<text x="123.2" y="197.0" font-family="sans-serif" font-size="11" fill="#d8dee9" text-anchor="start">leather_flask x1</text>
