<text x="512.0" y="197.0" font-family="sans-serif" font-size="11" fill="#d8dee9" text-anchor="start">purified_water_bottle x3</text>
<rect x="682.4" y="183.0" width="111.0" height="19" rx="4" fill="#161b24" stroke="#e5565b"/>
<text x="688.4" y="197.0" font-family="sans-serif" font-size="11" fill="#e5565b" text-anchor="start">rotten_flesh x8</text>
