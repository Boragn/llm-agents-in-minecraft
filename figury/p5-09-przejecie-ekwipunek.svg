<text x="518.0" y="92.0" font-family="sans-serif" font-size="12" fill="#7bc67b" text-anchor="start" font-weight="bold">przejeto</text>
<text x="518.0" y="114.0" font-family="sans-serif" font-size="11" fill="#d8dee9" text-anchor="start">mutton x1, white_wool x1</text>
<polygon points="734,96 746,102 734,108" fill="#8b97aa"/>
<line x1="728" y1="102" x2="736" y2="102" stroke="#8b97aa" stroke-width="2"/>
