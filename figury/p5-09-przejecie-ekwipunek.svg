<text x="274.0" y="92.0" font-family="sans-serif" font-size="12" fill="#d8dee9" text-anchor="start" font-weight="bold">wynik</text>
<text x="274.0" y="114.0" font-family="sans-serif" font-size="11" fill="#d8dee9" text-anchor="start">zabito polowanie: sheep zabity, ci</text>
<polygon points="490,96 502,102 490,108" fill="#8b97aa"/>
<line x1="484" y1="102" x2="492" y2="102" stroke="#8b97aa" stroke-width="2"/>
