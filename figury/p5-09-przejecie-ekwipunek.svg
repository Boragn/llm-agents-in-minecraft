<text x="805.4" y="197.0" font-family="sans-serif" font-size="11" fill="#7bc67b" text-anchor="start">white_wool x2</text>
<text x="20.0" y="248.0" font-family="sans-serif" font-size="11" fill="#e5565b" text-anchor="start">czerwone: podniesione biernie z ziemi (116 woreczkow atramentu, zgnile mieso): zadna akcja ich nie zebrala,</text>
<text x="20.0" y="264.0" font-family="sans-serif" font-size="11" fill="#e5565b" text-anchor="start">a mod nie loguje podniesien biernych; zielone: lup z wlasnych akcji (przejeto), czyli towar na szmaragd.</text>
<text x="20.0" y="296.0" font-family="sans-serif" font-size="11" fill="#e8d06b" text-anchor="start">Brakuje: ekwipunek nie mowi, co da sie sprzedac i za ile (to jest w pliku wiedzy, ktorego bot nie czytal).</text>
