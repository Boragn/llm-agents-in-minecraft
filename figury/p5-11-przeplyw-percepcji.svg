<text x="34.0" y="424.0" font-family="sans-serif" font-size="11" fill="#d8dee9" text-anchor="start">Model DOSTAJE PRZYGOTOWANE: menu A1..An z czasem, ryzykiem i pewnoscia oraz wynik walidacji (OK albo NIEWYKONALNE).</text>
<text x="34.0" y="442.0" font-family="sans-serif" font-size="11" fill="#8b97aa" text-anchor="start">Klatka decyzyjna (projekt): w fazie namyslu swiat stoi, model wola tylko odczyty bez skutkow ubocznych,</text>
<text x="34.0" y="460.0" font-family="sans-serif" font-size="11" fill="#8b97aa" text-anchor="start">a rekord decyzji zapisuje, ktore odczyty zrobil. Wtedy da sie rozdzielic zla decyzje od zlej percepcji.</text>
<text x="34.0" y="478.0" font-family="sans-serif" font-size="11" fill="#8b97aa" text-anchor="start">Strzalki: przeplyw danych w modzie (lewa czesc) i miedzy modem a modelem (prawa czesc).</text>
