<text x="14.0" y="1012.0" font-family="sans-serif" font-size="11" fill="#d8dee9" text-anchor="start">Wilga trzyma się planu zarobku bez dryfu: każda tura kończy się łańcuchem, który przybliża sprzedaż albo zakup. Decyzje są odruchami (0 tokenów</text>
<text x="14.0" y="1028.0" font-family="sans-serif" font-size="11" fill="#d8dee9" text-anchor="start">rozumowania, kilka słów przed akcją), bo menu podaje gotową akcję SPRZEDAJ z ceną i drogą. Jedyne rozwidlenie to skrzynia obok handlarza (A57), której</text>
<text x="14.0" y="1044.0" font-family="sans-serif" font-size="11" fill="#d8dee9" text-anchor="start">model nie otworzył: zawartość była nieznana z daleka, a menu nie mówi, co w niej jest. Peak (sprzedaż) wynika z decyzji podjętej dwie rundy wcześniej,</text>
<text x="14.0" y="1060.0" font-family="sans-serif" font-size="11" fill="#d8dee9" text-anchor="start">co pokazuje, że łańcuch niesie plan przez rundy bez wywołań.</text>
